<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>News Frame Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@600;800&family=Hind:wght@500;700&family=Mukta:wght@600;800&family=Baloo+2:wght@600;800&family=Khand:wght@500;700&family=Teko:wght@500;700&family=Yatra+One&family=Rozha+One&family=Tiro+Devanagari+Hindi&family=Kalam:wght@700&family=Noto+Serif+Devanagari:wght@600;800&family=Anek+Devanagari:wght@600;800&family=Martel:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f6;--pn:#fff;--tx:#111827;--bd:#d1d5db;--ac:#d90429;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f17;--pn:#151b27;--tx:#e5e7eb;--bd:#2a3344}}
:root[data-theme="dark"]{--bg:#0b0f17;--pn:#151b27;--tx:#e5e7eb;--bd:#2a3344}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px 'Noto Sans Devanagari','Segoe UI',Arial,sans-serif}
#app{display:flex;height:100vh;height:100dvh}
#side{width:340px;max-width:44%;overflow-y:auto;background:var(--pn);border-right:1px solid var(--bd);padding:10px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;min-height:0;background:#000}
canvas{max-width:100%;max-height:100%;background:#000}
#bar{display:flex;gap:8px;align-items:center;padding:10px;background:var(--pn);border-top:1px solid var(--bd);flex-wrap:wrap}
#bar input[type=range]{flex:1;min-width:120px}
button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.on{outline:2px solid var(--ac)}
details{border-bottom:1px solid var(--bd);padding:6px 0}
summary{font-weight:800;cursor:pointer;padding:4px 0}
label{display:block;margin:6px 0;font-size:12px;opacity:.9}
label input:not([type=checkbox]):not([type=color]),label select,label textarea{display:block;width:100%;margin-top:3px;padding:6px;border:1px solid var(--bd);border-radius:5px;background:var(--bg);color:var(--tx);font:inherit}
label.c{display:flex;align-items:center;gap:6px;float:none}
label input[type=color]{width:100%;height:30px;border:0;padding:0;margin-top:3px;background:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#rec{color:#d90429;font-weight:800;display:none}
#top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:var(--pn);border-bottom:1px solid var(--bd)}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-weight:600;font-size:12px;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#top small{opacity:.7;margin-left:6px}
#top2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:6px 10px;background:var(--pn);border-bottom:1px solid var(--bd);font-size:12px}
#top2 select{padding:5px;border:1px solid var(--bd);border-radius:5px;background:var(--bg);color:var(--tx);font:inherit}
input[type=range]{height:26px}
#tabs{display:none}
#stage{position:relative}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:6px 14px;border-radius:20px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:3;white-space:nowrap}
.locked #side details:not([data-tab="export"]){pointer-events:none;opacity:.45}
.locked #top,.locked #top2{pointer-events:none;opacity:.5}
.locked #cv{pointer-events:none}
.big{width:100%;padding:14px;font-size:16px;margin:6px 0}
.big2{flex:1;min-height:46px;font-size:15px}
.elrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.layinfo{font-weight:700;margin:6px 0}
.hint{font-size:12px;opacity:.75;margin:6px 0}
.nudge{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:8px auto}
.nudge button{padding:14px 0;font-size:22px}
.xp #xctl{display:flex!important;flex-wrap:wrap;gap:8px}
.xp button,.xp select{min-height:46px;font-size:15px}
.xp #rec{width:100%}
.chipbox{display:flex;flex-wrap:wrap;gap:6px}
@media(max-width:760px){#top,#top2{display:none!important}#tabs{display:flex;position:sticky;top:0;z-index:5;background:var(--pn);gap:4px;margin:-10px -10px 8px;padding:8px 10px;overflow-x:auto;border-bottom:1px solid var(--bd)}#tabs button{flex:1;min-width:66px;background:transparent;color:var(--tx);border:1px solid var(--bd);padding:8px 4px;font-size:13px}#tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}#app{flex-direction:column-reverse}#side{width:100%;max-width:none;flex:1;min-height:0;border-right:0;border-top:1px solid var(--bd)}main{flex:none;height:auto}#stage{flex:none;height:36vh;padding:6px}#top,#top2{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap}#top>*,#top2>*{flex:none}button,select,.chip{min-height:40px}#bar{gap:6px;padding:6px}#bar input[type=range]{min-width:80px}label input:not([type=checkbox]):not([type=color]),label select,label textarea{padding:9px;font-size:15px}}
</style>
</head>
<body>
<div id="app">
<aside id="side"></aside>
<main>
<div id="top"><button id="vbtn">📂 Video Choose</button><input type="file" id="vin" accept="video/*" hidden><small>Show/Hide:</small><span id="chips" style="display:contents"></span></div>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="bar">
<button id="pp">▶ Play</button>
<input type="range" id="seek" min="0" max="1000" value="0">
<span id="tm">0:00</span>
<button class="g" id="snap">PNG</button>
<span id="xctl" style="display:contents"><button id="fexp" title="Jaldi export">⚡ Fast Export</button><select id="fq" title="Output size"><option value="1">Full size</option><option value=".5">Half size (bahut tez)</option></select><select id="fsp" title="Speed"><option value="2">2x</option><option value="4" selected>4x</option><option value="8">8x</option></select><button id="exp" class="g" title="Real-time recording">⬇ Normal Export</button><button id="sv" class="g" style="display:none">⬇ Save</button><button id="sh" class="g" style="display:none">↗ Share</button>
<span id="rec">● Recording… tab khula rakhein</span></span>
</div>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d');
let F="'Noto Sans Devanagari','Segoe UI',Arial,sans-serif";
const FONTS=['Noto Sans Devanagari','Hind','Mukta','Baloo 2','Khand','Teko','Anek Devanagari','Martel','Noto Serif Devanagari','Tiro Devanagari Hindi','Rozha One','Yatra One','Kalam'];
function setFont(){F="'"+S.font+"','Noto Sans Devanagari','Segoe UI',Arial,sans-serif";document.fonts.load('800 20px "'+S.font+'"');document.fonts.load('600 20px "'+S.font+'"')}
const vid=document.createElement('video');vid.playsInline=true;vid.loop=true;vid.setAttribute('playsinline','');vid.preload='auto';vid.style.cssText='position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none';document.body.appendChild(vid);
let logo=null,W=1280,H=720,u=1,recording=false;
const R={'16:9':[1280,720],'9:16':[720,1280],'1:1':[900,900],'4:5':[864,1080]};
const S={tpl:'classic',font:'Noto Sans Devanagari',lg:1,asy:0,bg:1,ratio:'16:9',fit:'cover',vs:1,vx:0,vy:0,
channel:'Dooars Comrades',tag:'LIVE',loc:'डुआर्स',breaking:'BREAKING NEWS',
head:'यहाँ अपनी खबर की हेडलाइन लिखें',sub:'विषय / उप-शीर्षक',name:'नाम यहाँ',desig:'पद / परिचय',
ticker:'यहाँ स्क्रॉल होने वाली ताज़ा खबरें लिखें • दूसरी खबर यहाँ',tlabel:'ताज़ा खबर',
showBrk:1,showHead:1,showSub:1,showLoc:1,showTag:1,showName:0,showTick:1,showCh:1,
hs:1,ss:1,bs:1,ls:1,ks:1,ns:1,tspeed:120,off:0,align:'left',tdir:'left',
c1:'#0b3d91',c2:'#0a1f44',c3:'#d90429',tc:'#ffffff'};
let saved=false;try{const sv=JSON.parse(localStorage.getItem('nfs')||'null');if(sv){Object.assign(S,sv);saved=true}}catch(e){}
const P={classic:['#0b3d91','#0a1f44','#d90429'],interview:['#d90429','#0a1f44','#ff6b00'],split:['#f5b700','#12263a','#d90429'],topticker:['#7b2cbf','#240046','#ff0054'],reel:['#00a896','#02131a','#ef233c'],minimal:['#ffb703','#111827','#e63946']};
const TPL=[['classic','📺 Classic Bar'],['interview','🎤 Interview'],['split','🖼 Split Frame'],['topticker','⬆ Top Ticker'],['reel','📱 Reel / Shorts'],['minimal','✨ Minimal']];

/* helpers */
let bb=null,SEL=null,tr=0;const O={},HIT=[];
function grow(x0,y0,x1,y1){if(!bb)bb=[x0,y0,x1,y1];else{bb[0]=Math.min(bb[0],x0);bb[1]=Math.min(bb[1],y0);bb[2]=Math.max(bb[2],x1);bb[3]=Math.max(bb[3],y1)}}
function el(k,fn){const o=O[k]||(O[k]={x:0,y:0});cx.save();cx.translate(o.x,o.y);bb=null;tr=1;fn();tr=0;if(bb){bb=[Math.max(0,bb[0]),Math.max(0,bb[1]),Math.min(W,bb[2]),Math.min(H,bb[3])];HIT.push({k,x0:bb[0]+o.x,y0:bb[1]+o.y,x1:bb[2]+o.x,y1:bb[3]+o.y});
if(SEL==k&&!recording){cx.shadowBlur=0;cx.setLineDash([8*u,6*u]);cx.strokeStyle='#00e5ff';cx.lineWidth=2*u;cx.strokeRect(bb[0]-4*u,bb[1]-4*u,bb[2]-bb[0]+8*u,bb[3]-bb[1]+8*u);cx.setLineDash([])}}bb=null;cx.restore()}
function ticker(y,h){el('tick',()=>tickerRaw(y,h))}
function brk(x,y){let h=0;el('brk',()=>{h=brkRaw(x,y)});return h}
function hb(x,w,bg,sc,k=1){const o=hbRaw(x,w,bg,sc,k);return{h:o.h,draw:y=>el('head',()=>o.draw(y))}}
function npl(x){const o=nplRaw(x);return o&&{w:o.w,h:o.h,draw:yb=>el('name',()=>o.draw(yb))}}
function rect(x,y,w,h,c,r=0){if(tr)grow(x,y,x+w,y+h);cx.shadowBlur=0;cx.fillStyle=c;cx.beginPath();cx.roundRect?cx.roundRect(x,y,w,h,r):cx.rect(x,y,w,h);cx.fill()}
function font(s,w=700){cx.font=w+' '+s+'px '+F}
function txt(t,x,y,s,c,al='left',w=700){font(s,w);if(tr){const mw=cx.measureText(t).width,x0=al=='center'?x-mw/2:al=='right'?x-mw:x;grow(x0,y-s*.6,x0+mw,y+s*.6)}cx.fillStyle=c;cx.textAlign=al;cx.textBaseline='middle';cx.shadowColor='rgba(0,0,0,.45)';cx.shadowBlur=4*u;cx.fillText(t,x,y);cx.shadowBlur=0}
function wrap(t,s,mw,w){font(s,w);const ws=t.split(/\s+/),o=[];let l='';for(const x of ws){const n=l?l+' '+x:x;if(cx.measureText(n).width>mw&&l){o.push(l);l=x}else l=n}if(l)o.push(l);return o}
function drawVid(x,y,w,h){cx.save();cx.beginPath();cx.rect(x,y,w,h);cx.clip();cx.fillStyle='#111';cx.fillRect(x,y,w,h);
const src=VF||vid,vw=VF?VF.displayWidth:vid.videoWidth,vh=VF?VF.displayHeight:vid.videoHeight;
if(VF||(vid.videoWidth&&vid.readyState>=2)){const rw=ROT%180?vh:vw,rh=ROT%180?vw:vh,k=(S.fit=='cover'?Math.max(w/rw,h/rh):Math.min(w/rw,h/rh))*S.vs;cx.translate(x+w/2+S.vx*w/100,y+h/2+S.vy*h/100);cx.rotate(ROT*Math.PI/180);cx.drawImage(src,-vw*k/2,-vh*k/2,vw*k,vh*k)}
else{const g=cx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'#1f2937');g.addColorStop(1,'#374151');cx.fillStyle=g;cx.fillRect(x,y,w,h);txt(vid.src?(vid.videoWidth?'Loading…':'Video dikh nahi raha (codec support nahi)'):'Video upload karein',x+w/2,y+h/2,30*u,'#9ca3af','center')}
cx.restore()}
function tickH(){return 24*u*S.ks+22*u}
function tickerRaw(y,h){if(!S.showTick)return;rect(0,y,W,h,S.c2);const sz=24*u*S.ks;let lw=0;
if(S.tlabel){font(sz,800);lw=cx.measureText(S.tlabel).width+36*u}
cx.save();cx.beginPath();cx.rect(lw,y,W-lw,h);cx.clip();
const str=S.ticker+'     ◆     ';font(sz,600);const w=Math.max(cx.measureText(str).width,10);
if(S.tdir=='static')txt(S.ticker,lw+16*u,y+h/2,sz,S.tc,'left',600);
else{const off=(nowT()/1000*S.tspeed*u)%w;let x=S.tdir=='left'?lw-off:lw-w+off;for(;x<W;x+=w)txt(str,x,y+h/2,sz,S.tc,'left',600)}
cx.restore();if(lw){rect(0,y,lw,h,S.c1);txt(S.tlabel,lw/2,y+h/2,sz,'#fff','center',800)}}
function chip(t,x,y,sz,bg,fg){font(sz,800);const w=cx.measureText(t).width+28*u,h=sz+16*u;rect(x,y,w,h,bg,6*u);txt(t,x+14*u,y+h/2,sz,fg,'left',800);return w+10*u}
function topbar(l=24*u,t=24*u,r=W-24*u){let x=l;const sz=20*u*S.ls;
el('chips',()=>{if(S.showTag&&S.tag)x+=chip(S.tag,x,t,sz,S.c3,'#fff');
if(S.showLoc&&S.loc)chip('📍 '+S.loc,x,t,sz,'rgba(0,0,0,.65)','#fff')});
el('logo',()=>{if(S.showCh){if(logo){const h=56*u*S.lg,w=logo.width/logo.height*h;cx.drawImage(logo,r-w,t,w,h)}
else if(S.channel){const sz2=22*u*S.lg;font(sz2,800);const w=cx.measureText(S.channel).width+28*u;rect(r-w,t,w,sz2+16*u,S.c1,6*u);txt(S.channel,r-w/2,t+(sz2+16*u)/2,sz2,'#fff','center',800)}}})}
function brkH(){return S.showBrk&&S.breaking?24*u*S.bs+18*u:0}
function brkRaw(x,y){const h=brkH();if(!h)return 0;const sz=24*u*S.bs;font(sz,800);const w=cx.measureText(S.breaking).width+36*u;
const blink=Math.floor(nowT()/700)%2;rect(x,y-h,w,h,blink?S.c3:'#fff');txt(S.breaking,x+w/2,y-h/2,sz,blink?'#fff':S.c3,'center',800);return h}
function hbRaw(x,w,bg,sc,k=1){const hs=40*u*S.hs*k,ss=24*u*S.ss*k,pad=20*u;
const hl=S.showHead&&S.head?wrap(S.head,hs,w-2*pad,800):[],sl=S.showSub&&S.sub?wrap(S.sub,ss,w-2*pad,600):[];
const h=(hl.length||sl.length)?hl.length*hs*1.2+sl.length*ss*1.25+pad*1.4:0;
return{h,draw(y){if(!h)return;if(bg)rect(x,y,w,h,bg);const al=S.align,tx=al=='left'?x+pad:al=='center'?x+w/2:x+w-pad;let t=y+pad*.7;
hl.forEach((l,i)=>txt(l,tx,t+hs*1.2*i+hs*.6,hs,S.tc,al,800));t+=hl.length*hs*1.2;
sl.forEach((l,i)=>txt(l,tx,t+ss*1.25*i+ss*.625,ss,sc,al,600))}}}
function nplRaw(x){if(!S.showName||!S.name)return null;const a=32*u*S.ns,d=20*u*S.ns;font(a,800);let w=cx.measureText(S.name).width;font(d,600);
w=Math.max(w,S.desig?cx.measureText(S.desig).width:0)+44*u;const h1=a+20*u,h2=S.desig?d+14*u:0;
return{w,h:h1+h2,draw(yb){rect(x,yb-h1-h2,w,h1,S.c1);txt(S.name,x+22*u,yb-h2-h1/2,a,'#fff','left',800);if(h2){rect(x,yb-h2,w,h2,S.c2);txt(S.desig,x+22*u,yb-h2/2,d,'#fff','left',600)}}}}
function shade(top,hh){const y=top?0:H-hh,g=cx.createLinearGradient(0,top?0:H,0,top?hh:H-hh);g.addColorStop(0,'rgba(0,0,0,.85)');g.addColorStop(1,'rgba(0,0,0,0)');cx.shadowBlur=0;cx.fillStyle=g;cx.fillRect(0,y,W,hh)}
const SUB='#ffd54a';

/* templates */
const TP={
classic(){drawVid(0,0,W,H);topbar();let y=H-S.off*u;if(S.showTick){y-=tickH();ticker(y,tickH())}
const b=hb(0,W,S.c2,SUB);y-=b.h;b.draw(y);if(b.h)rect(0,y,W,4*u,S.c1);y-=brk(24*u,y);const n=npl(24*u);if(n)n.draw(y-8*u)},
interview(){drawVid(0,0,W,H);topbar();let y=H-S.off*u;if(S.showTick){y-=tickH();ticker(y,tickH())}
const p=24*u,n=npl(p),nw=n?n.w:0,b=hb(p+nw,W-2*p-nw,'rgba(10,20,50,.92)',SUB),hh=Math.max(b.h,n?n.h:0),yy=y-14*u-hh;
if(n)n.draw(yy+hh);b.draw(yy+hh-b.h);brk(p,yy)},
split(){const g=cx.createLinearGradient(0,0,W,H);g.addColorStop(0,S.c2);g.addColorStop(1,'#000');cx.fillStyle=g;cx.fillRect(0,0,W,H);
const p=24*u,land=W>=H;let tb=H-S.off*u;if(S.showTick){tb-=tickH();ticker(tb,tickH())}
let vr,tx,tw;if(land){vr=[p,p,W*.68,tb-2*p];tx=p+vr[2]+p;tw=W-tx-p}else{vr=[p,p,W-2*p,(tb-p)*.52];tx=p;tw=W-2*p}
rect(vr[0]-4*u,vr[1]-4*u,vr[2]+8*u,vr[3]+8*u,S.c1,4*u);drawVid(...vr);topbar(vr[0]+12*u,vr[1]+12*u,vr[0]+vr[2]-12*u);
let y=land?p:vr[1]+vr[3]+p;const bh=brkH();if(bh){brk(tx,y+bh);y+=bh}
const b=hb(tx,tw,'rgba(0,0,0,.35)',SUB);b.draw(y);y+=b.h+12*u;const n=npl(tx);if(n)n.draw(y+n.h)},
topticker(){drawVid(0,0,W,H);let t0=0;if(S.showTick){ticker(0,tickH());t0=tickH()}topbar(24*u,t0+16*u);
const mw=W*.86,x=(W-mw)/2,b=hb(x,mw,S.c1,'#fff');let y=H-(S.off+30)*u-b.h;b.draw(y);y-=brk(x,y);const n=npl(x);if(n)n.draw(y-8*u)},
reel(){drawVid(0,0,W,H);shade(1,H*.6);shade(0,H*.3);topbar();const p=24*u;let y=(86+S.off)*u;const bh=brkH();if(bh){brk(p,y+bh);y+=bh}
const b=hb(p,W-2*p,null,SUB,1.3);b.draw(y);y+=b.h+10*u;const n=npl(p);if(n)n.draw(y+n.h);if(S.showTick)ticker(H-tickH(),tickH())},
minimal(){drawVid(0,0,W,H);shade(0,H*.45);topbar();let y=H-S.off*u-26*u;if(S.showTick){y=H-S.off*u-tickH();ticker(y,tickH());y-=14*u}
const x=36*u,b=hb(x+10*u,Math.min(W*.8,W-2*x),null,'#e5e7eb');y-=b.h;b.draw(y);if(b.h)rect(x,y+8*u,6*u,b.h-16*u,S.c1);y-=brk(x,y-4*u)+4*u;const n=npl(x);if(n)n.draw(y-8*u)}
};

/* canvas + loop */
function setRatio(k){S.ratio=k;[W,H]=R[k];cv.width=W;cv.height=H;u=Math.min(W,H)/720}
function frame(){if(!FAST){cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,W,H);cx.shadowBlur=0;HIT.length=0;try{TP[S.tpl]()}catch(e){tr=0;bb=null;window.__lastErr=e;try{cx.restore()}catch(x){}}}
if(vid.duration&&!seeking){$('seek').value=vid.currentTime/vid.duration*1000}
$('tm').textContent=fmt(vid.currentTime)+' / '+fmt(vid.duration||0);$('pp').textContent=vid.paused?'▶ Play':'⏸ Pause';requestAnimationFrame(frame)}
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
let seeking=false;
$('seek').oninput=e=>{seeking=true;if(vid.duration)vid.currentTime=e.target.value/1000*vid.duration};
$('seek').onchange=()=>seeking=false;
